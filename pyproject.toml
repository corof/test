[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swinglab"
version = "0.1.0"
description = "Golfschwung-Analyse mit zwei Webcams (Down-the-Line + Face-On) und Mevo+-Daten"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "opencv-python>=4.8",
  "mediapipe>=0.10.14",
  "sounddevice>=0.4.6",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
swinglab = "swinglab.cli:main"

[tool.setuptools.packages.find]
include = ["swinglab*"]

[tool.setuptools.package-data]
swinglab = ["default_config.toml"]
